name: Build Desktop Apps

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Windows-exe
            asset_name: MyApp-Windows.exe
          - os: macos-latest
            artifact_name: macOS-app
            asset_name: MyApp-macOS.app
          - os: ubuntu-latest
            artifact_name: Linux-AppImage
            asset_name: MyApp-Linux.AppImage

    steps:
      # 1. Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up clean Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # -------------------------------------------------------------
      # WINDOWS BUILD
      # -------------------------------------------------------------
      - name: Build Windows Executable (.exe)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --name "MyApp-Windows" --add-data "gui;gui" main.py

      # -------------------------------------------------------------
      # MACOS BUILD (.app)
      # -------------------------------------------------------------
      - name: Build macOS Application (.app)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onedir --name "MyApp-macOS" --add-data "gui:gui" main.py

      # -------------------------------------------------------------
      # LINUX BUILD (AppImage)
      # -------------------------------------------------------------
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-webkit2-4.0

      - name: Build Linux PyInstaller & AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Build directory bundle with PyInstaller
          pyinstaller --noconsole --onedir --name "MyApp" --add-data "gui:gui" main.py

          # 2. Download appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          # 3. Create basic AppDir structure for AppImage
          mkdir -p AppDir/usr/bin
          cp -r dist/MyApp/* AppDir/usr/bin/

          # Create AppRun entrypoint
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/MyApp" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create desktop entry file
          cat << 'EOF' > AppDir/myapp.desktop
          [Desktop Entry]
          Name=MyApp
          Exec=AppRun
          Icon=myapp
          Type=Application
          Categories=Utility;
          EOF

          # Dummy icon (Required by appimagetool)
          touch AppDir/myapp.png

          # 4. Compile AppImage (ARCH=x86_64 required in CI)
          ARCH=x86_64 ./appimagetool AppDir MyApp-Linux.AppImage

      # -------------------------------------------------------------
      # UPLOAD ARTIFACTS
      # -------------------------------------------------------------
      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MyApp-Windows.exe

      - name: Upload macOS Artifact (.app bundle)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MyApp-macOS.app

      - name: Upload Linux Artifact (AppImage)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: MyApp-Linux.AppImage
