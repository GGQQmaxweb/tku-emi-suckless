name: Build Desktop Apps

on:
  push:
    branches: [ "main", "master" ,"dev-ci-workflow" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Windows-exe
            asset_name: MyApp-Windows.exe
          - os: macos-latest
            artifact_name: macOS-app
            asset_name: MyApp-macOS.app
          - os: ubuntu-latest
            artifact_name: Linux-Packages
            asset_name: |
              *.deb
              *.rpm
              *.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Linux system dependencies (GTK, Cairo, WebKit2Gtk)
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            libfuse2t64 || sudo apt-get install -y libfuse2
        shell: bash

      # Install Python packages safely across OSes
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pywebview pyinstaller pyinstaller-hooks-contrib
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          fi
        shell: bash

      # Windows Build
      - name: Build Windows Executable (.exe)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --name "MyApp-Windows" --add-data "gui;gui" main.py

      # macOS Build
      - name: Build macOS Application (.app)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onedir --name "MyApp-macOS" --add-data "gui:gui" main.py

# -------------------------------------------------------------
      # LINUX BUILD (.deb, .rpm & AppImage Backup)
      # -------------------------------------------------------------
      - name: Install System Packaging Tools & Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ruby ruby-dev rubygems build-essential rpm \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            libfuse2t64 || sudo apt-get install -y libfuse2
          sudo gem install --no-document fpm
        shell: bash

      - name: Install Python Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pywebview pyinstaller pyinstaller-hooks-contrib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build PyInstaller Binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconsole --onedir --name "myapp" --add-data "gui:gui" main.py
        shell: bash

      # -------------------------------------------------------------
      # PRIMARY PACKAGES: .deb and .rpm (via fpm)
      # -------------------------------------------------------------
      - name: Package .deb and .rpm with fpm
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Setup staging layout for fpm
          mkdir -p staging/opt/myapp
          mkdir -p staging/usr/share/applications

          cp -r dist/myapp/* staging/opt/myapp/
          
          cat << 'EOF' > staging/usr/share/applications/myapp.desktop
          [Desktop Entry]
          Name=MyApp
          Exec=/opt/myapp/myapp
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF

          # Build .deb
          fpm -s dir -t deb \
            -n myapp \
            -v 1.0.0 \
            --architecture amd64 \
            --depends "python3-gi" \
            --depends "gir1.2-gtk-3.0" \
            --depends "gir1.2-webkit2-4.1 | gir1.2-webkit2-4.0" \
            -C staging .

          # Build .rpm
          fpm -s dir -t rpm \
            -n myapp \
            -v 1.0.0 \
            --architecture x86_64 \
            --depends "python3-gobject" \
            --depends "gtk3" \
            --depends "(webkit2gtk4.1 or webkit2gtk3 or webkit2gtk4.0)" \
            -C staging .
        shell: bash

      # -------------------------------------------------------------
      # BACKUP PLAN: AppImage
      # (continue-on-error ensures .deb/.rpm aren't blocked if this fails)
      # -------------------------------------------------------------
      - name: Build AppImage (Backup)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # 1. Download appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          # 2. Create AppDir structure from PyInstaller dist output
          mkdir -p AppDir/usr/bin
          cp -r dist/myapp/* AppDir/usr/bin/

          # 3. Entrypoint script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/myapp" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 4. Desktop entry & icon
          cat << 'EOF' > AppDir/myapp.desktop
          [Desktop Entry]
          Name=MyApp
          Exec=AppRun
          Icon=myapp
          Type=Application
          Categories=Utility;
          EOF

          touch AppDir/myapp.png

          # 5. Build AppImage
          ARCH=x86_64 ./appimagetool AppDir MyApp-Linux.AppImage
        shell: bash
          
      # Artifact Uploads
      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MyApp-Windows.exe

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MyApp-macOS.app
      
      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.deb
            *.rpm
            *.AppImage
