name: Build Desktop Apps

on:
  push:
    branches: [ "main", "master" ,"dev-ci-workflow" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Windows-exe
            asset_name: MyApp-Windows.exe
          - os: macos-latest
            artifact_name: macOS-app
            asset_name: MyApp-macOS.app
          - os: ubuntu-latest
            artifact_name: Linux-Packages
            asset_name: |
              *.deb
              *.rpm
              *.AppImage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Linux system dependencies (GTK, Cairo, WebKit2Gtk)
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            libfuse2t64 || sudo apt-get install -y libfuse2
        shell: bash

      # Install Python packages safely across OSes
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pywebview pyinstaller pyinstaller-hooks-contrib
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          fi
        shell: bash

      # Windows Build
      - name: Build Windows Executable (.exe)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --name "MyApp-Windows" --add-data "gui;gui" main.py

      # macOS Build
      - name: Build macOS Application (.app)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onedir --name "MyApp-macOS" --add-data "gui:gui" main.py

      # -------------------------------------------------------------
      # LINUX BUILD (.deb, .rpm & Qt AppImage)
      # -------------------------------------------------------------
      - name: Install System Packaging Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libfuse2t64 || sudo apt-get install -y libfuse2
          sudo gem install --no-document fpm
        shell: bash

      # -------------------------------------------------------------
      # STEP 1: Build Lightweight PyInstaller Bundle (for .deb & .rpm)
      # -------------------------------------------------------------
      - name: Build Lightweight Bundle (.deb / .rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pywebview pyinstaller pyinstaller-hooks-contrib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # Build GTK-based lightweight binary (~10-15MB)
          TYPELIB_DIR="/usr/lib/x86_64-linux-gnu/girepository-1.0"
          pyinstaller --noconsole --onedir --name "myapp_light" \
            --collect-all gi \
            --collect-all webview \
            --add-data "$TYPELIB_DIR:gi_typelibs" \
            --add-data "gui:gui" \
            main.py
        shell: bash

      - name: Package .deb and .rpm with fpm
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Setup staging layout using light bundle
          mkdir -p staging/opt/myapp
          mkdir -p staging/usr/share/applications

          cp -r dist/myapp_light/* staging/opt/myapp/
          
          cat << 'EOF' > staging/usr/share/applications/myapp.desktop
          [Desktop Entry]
          Name=MyApp
          Exec=/opt/myapp/myapp_light
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF

          # Build .deb
          fpm -s dir -t deb \
            -n myapp \
            -v 1.0.0 \
            --architecture amd64 \
            --depends "python3-gi" \
            --depends "gir1.2-gtk-3.0" \
            --depends "gir1.2-webkit2-4.1 | gir1.2-webkit2-4.0" \
            -C staging .

          # Build .rpm
          fpm -s dir -t rpm \
            -n myapp \
            -v 1.0.0 \
            --architecture x86_64 \
            --depends "python3-gobject" \
            --depends "gtk3" \
            --depends "webkit2gtk4.1" \
            -C staging .
        shell: bash

      # -------------------------------------------------------------
      # STEP 2: Build Self-Contained Qt Bundle (for AppImage)
      # -------------------------------------------------------------
      - name: Build Qt Self-Contained AppImage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # 1. Install PySide6 into environment specifically for AppImage build
          pip install "pywebview[pyside6]" qtpy

          # 2. Build PyInstaller bundle with QtWebEngine included (~130MB)
          pyinstaller --noconsole --onedir --name "myapp_qt" --add-data "gui:gui" main.py

          # 3. Download appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          # 4. Create AppDir structure using the Qt bundle
          mkdir -p AppDir/usr/bin
          cp -r dist/myapp_qt/* AppDir/usr/bin/

          # 5. Entrypoint script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/myapp_qt" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 6. Desktop entry
          cat << 'EOF' > AppDir/myapp.desktop
          [Desktop Entry]
          Name=MyApp
          Exec=AppRun
          Icon=myapp
          Type=Application
          Categories=Utility;
          EOF

          touch AppDir/myapp.png

          # 7. Compile AppImage
          ARCH=x86_64 ./appimagetool AppDir MyApp-Linux.AppImage
        shell: bash

      # Artifact Uploads
      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MyApp-Windows.exe

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MyApp-macOS.app
      
      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.deb
            *.rpm
            *.AppImage
